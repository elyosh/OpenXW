# Point lights for the Windows 1998 proving-ground models in modern rendering.
# Loaded with the OPT asset cache; restart the application after editing.
# The global config.yaml point_lights switch, scale and range_scale also apply.
version: 1
enabled: true
# Intensity follows the renderer's 0.5 / distance attenuation, not physical lumens.
# Radius and positions are in metres.
intensity: 2000
radius: 50

# Model basenames are case-insensitive. Colors are sRGB values in [0, 1].
# Components 1..3 are the checkpoints; positions use the original OPT X/Y/Z axes.
# Each source sits 1.5625 metres above the colored top face. Colors retain its hue.
# Variants are the effective two-bit checkpoint selection, including blink-off 0.
# A lamp emits only for a listed variant; an empty list disables that lamp.
# Some switches retain their colored last texture after passing a checkpoint.
# At most eight models and three lamps per model; omitted components emit no light.
models:
  - model: GATE1.OPT
    color: [0.23, 0.72, 1.0]
    lamps:
      - component: 1
        position: [0, 167.578125, 23.046875]
        variants: [1, 2, 3]
      - component: 2
        position: [0, 4.6875, 23.046875]
        variants: [1, 2, 3]
      - component: 3
        position: [0, -173.046875, 23.046875]
        variants: [1, 2, 3]

  - model: GATE-S1.OPT
    color: [0.23, 0.72, 1.0]
    lamps:
      - component: 1
        position: [-28.3203125, -165.0390625, 22.8515625]
        variants: [1, 2, 3]
      - component: 2
        position: [29.4921875, 4.4921875, 22.8515625]
        variants: [1, 2, 3]
      - component: 3
        position: [0, 167.7734375, 22.8515625]
        variants: [1, 2, 3]

  - model: GATE2.OPT
    color: [0.0, 1.0, 0.23]
    lamps:
      - component: 1
        position: [0, 167.578125, 23.046875]
